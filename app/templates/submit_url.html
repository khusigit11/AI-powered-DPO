{% extends "base.html" %}
{% block title %}Submit URL{% endblock %}
{% block content %}
<h2 class="mb-4"><i class="bi bi-link-45deg"></i> Submit URL for Review</h2>
<div class="card p-4">
    <form method="POST">
        <div class="mb-3">
            <label for="url" class="form-label">URL</label>
            <input type="text" class="form-control" id="url" name="url" placeholder="https://example.com" required>
            <div class="form-text">The AI-DPO system will scan this URL for phishing indicators.</div>
        </div>
        <button type="submit" class="btn btn-primary"><i class="bi bi-send"></i> Submit URL</button>
    </form>
</div>
{% endblock %}
