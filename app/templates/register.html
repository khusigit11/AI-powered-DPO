{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4 mt-4">
            <div class="text-center mb-3">
                <i class="bi bi-person-plus" style="font-size: 2.5rem; color: #4f46e5;"></i>
                <h3 class="mt-2">Create Account</h3>
                <p class="text-muted">Register for the AI-DPO system</p>
            </div>
            <form method="POST" action="{{ url_for('main.register') }}">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username" required placeholder="Choose a username">
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" required placeholder="Enter email address">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required placeholder="Choose a password" minlength="6">
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2">
                    <i class="bi bi-person-plus"></i> Register
                </button>
            </form>
            <div class="text-center mt-3">
                <small class="text-muted">Already have an account? <a href="{{ url_for('main.login') }}">Login here</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
