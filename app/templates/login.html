{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4 mt-4">
            <div class="text-center mb-3">
                <i class="bi bi-shield-lock" style="font-size: 2.5rem; color: #4f46e5;"></i>
                <h3 class="mt-2">Sign In</h3>
                <p class="text-muted">Access the AI-DPO system</p>
            </div>
            <form method="POST" action="{{ url_for('main.login') }}">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username" required placeholder="Enter username">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required placeholder="Enter password">
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2">
                    <i class="bi bi-box-arrow-in-right"></i> Login
                </button>
            </form>
            <div class="text-center mt-3">
                <small class="text-muted">Don't have an account? <a href="{{ url_for('main.register') }}">Register here</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
